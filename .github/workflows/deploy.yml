name: Deploy HR Nexus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-nexus-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ b1e41da21e7671a9c76745f82207d68a }}
      CLOUDFLARE_API_TOKEN: ${{ cfat_igzzgpb25ramcaDKo0SVIu20skkUrW5JmKoXpFOV1e9c3fc0 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npx wrangler deploy
